note: >-
  Blue Owl Capital is an alternative asset manager with a Drupal corporate site and no product
  documentation, so the only regulatory-posture signal it publishes on a public surface is the
  verifiable data-subject request channel in its Privacy Notice (last revised May 1, 2026).
  The notice states the company has not sold or "shared" personal information in the preceding
  12 months but makes NO statement about honoring Global Privacy Control signals, so
  global_privacy_control is left unset rather than probed with a Sec-GPC header. No accessibility
  conformance report, subprocessor list, DPA, SBOM, data-residency, AI-transparency, incident-SLA,
  age-assurance, notice-and-action, transparency-report or exit-assistance page exists — every
  conventional path returned a real Drupal 404. Prior artifacts offered nothing to harvest: no
  security.txt, trust center, lifecycle or conformance file exists in this repository.
