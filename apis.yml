description: >-
  Blue Owl Capital Inc. (NYSE: OWL) is a New York-headquartered alternative asset manager formed in
  2021 from the merger of Owl Rock and Dyal Capital, with Oak Street joining in 2022. It manages
  over $319 billion of assets across three platforms — Credit (direct lending), Real Assets (net
  lease real estate and digital infrastructure) and GP Strategic Capital (minority stakes in
  alternative asset managers) — plus insurance solutions, serving institutional investors, financial
  advisors, individual investors and insurance companies, and runs several publicly traded BDCs
  including Blue Owl Capital Corporation. Blue Owl publishes no public API, developer portal, SDK
  or machine-readable contract; its only investor-facing software surfaces are gated third-party
  portals (iCapital, DST Vision) reached from blueowl.com/portals.
